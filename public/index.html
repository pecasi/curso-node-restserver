<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <title>Google Sign-in</title>
</head>
<body>
    <h1>Google Sign-in</h1>
    <hr>

    <div id="g_id_onload"
        data-client_id="783814203872-gao2vsdt4qcn4n4mbl4e56qg94s7ea3o.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false"
        data-auto_select="true">
    </div>
    <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="sign_in_with"
        data-shape="rectangular"
        data-logo_alignment="left">
    </div>

    <button id="signout-button">
        Sign out
    </button>

    <hr>
      <h1>One Tap</h1>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const url = (window.location.hostname.includes('restserver-curso-node-pecasi-41e2e3d1d9e7.herokuapp.com'))
        ? 'http://localhost:8080/api/auth/google' //'https://restserver-curso-node-pecasi-41e2e3d1d9e7.herokuapp.com/api/auth/google'
        : (window.location.hostname.includes('curso-node-restserver-production-2698.up.railway.app'))
        ? 'https://curso-node-restserver-production-2698.up.railway.app/api/auth/google'
        : 'http://localhost:8080/api/auth/google';

        console.log(url);

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);

            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Given Name: ' + responsePayload.given_name);
            console.log('Family Name: ' + responsePayload.family_name);
            console.log("Image URL: " + responsePayload.picture);
            console.log("Email: " + responsePayload.email);

            // Google JWT ID token: ID_TOKEN
            const body = { id_token: response.credential };

            // console.log(url);
            // console.log(window.location.hostname);
            // console.log(body);

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })  
            .then( resp => resp.json())
            .catch( err => console.log('Error en la respuesta: ', err))
            .then( data => {
                console.log(data);
                localStorage.setItem('email', data.usuario.email );
            })
            .catch( console.warn );             
        }

        const signoutButton = document.getElementById('signout-button');
        signoutButton.onclick = () => {
            google.accounts.id.disableAutoSelect();
            google.accounts.id.revoke(localStorage.getItem('email'), done => {
                console.log('consent revoked');
                localStorage.clear();
                location.reload();
            });
        };

        const decodeJwtResponse = (token) => {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
